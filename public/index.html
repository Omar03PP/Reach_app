<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node Starter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f5f5f5;
      color: #333;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p  { color: #666; margin-bottom: 1.5rem; }
    button {
      padding: 0.6rem 1.4rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #1d4ed8; }
    #resultado { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Node Starter 🚀</h1>
  <p>Proyecto base listo para modificar</p>
  <button onclick="llamarAPI()">Llamar API</button>
  <div id="resultado"></div>

  <script>
    async function llamarAPI() {
      const res = await fetch('/api/saludo');
      const data = await res.json();
      document.getElementById('resultado').textContent = data.mensaje;
    }
  </script>
</body>
</html>
